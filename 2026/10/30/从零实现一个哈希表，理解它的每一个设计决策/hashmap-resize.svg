<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 351" width="1100" height="351" role="img" aria-label="翻倍扩容：旧桶里的元素只会去两个地方">
<defs>
  <marker id="arrow" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="8" markerHeight="7"
          orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0 0.6 L9.5 4 L0 7.4 Z" fill="context-stroke"/>
  </marker>
  <marker id="arrow-muted" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="8" markerHeight="7"
          orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0 0.6 L9.5 4 L0 7.4 Z" fill="#6b7280"/>
  </marker>
<style>
/* 变量声明在 svg 根元素上，不是 :root —— 独立 SVG 文档里 :root 不生效，
   变量会解析失败并回退成黑色填充（曾导致整张图变成黑底）。 */
svg {
  --bg: #ffffff; --bg-soft: #f6f7f9;
  --ink: #1f2328; --ink-muted: #6b7280;
  --line: #c9ced6; --neutral: #eef0f3;
  --primary: #3b6fd4; --primary-soft: #e4ecfb;
  --accent: #2f9e8f; --accent-soft: #dff2ef;
  --warn: #d98324; --warn-soft: #fbeedd;
  --danger: #c8483c; --danger-soft: #fae5e2;
  --violet: #7c5cbf; --violet-soft: #eee8f8;
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',sans-serif;
}
text { fill: var(--ink); }
.t-title { font-size: 26px; font-weight: 650; }
.t-sub { font-size: 14px; fill: var(--ink-muted); }
.t-region { font-size: 15px; font-weight: 600; }
.t-node { font-size: 14px; }
.t-node-sub { font-size: 11.5px; fill: var(--ink-muted); }
.t-label { font-size: 11.5px; fill: var(--ink-muted); }
.t-conclusion { font-size: 13px; font-weight: 550; }
.t-legend { font-size: 11.5px; fill: var(--ink-muted); }
.t-mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 11.5px; }
.edge { fill: none; }
.edge-label-bg { fill: var(--bg); }
</style>
</defs>
<rect width="1100" height="351" fill="#ffffff"/>
<text class="t-title" x="32" y="54">翻倍扩容：旧桶里的元素只会去两个地方</text>
<text class="t-sub" x="32" y="74">教学实现 · 桶数 8 → 16 · 负载因子阈值 0.75</text>
<path class="edge" d="M227.2 135.0 C350.4 135.0 350.4 186.0 473.5 186.0" stroke="var(--primary)" stroke-width="2.0" marker-end="url(#arrow)"/>
<path class="edge" d="M626.5 186.0 C753.1 186.0 753.1 135.0 879.8 135.0" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect class="edge-label-bg" x="689.4" y="154.7" width="111.5" height="15" rx="3"/><text class="t-label" x="745.2" y="165.7" text-anchor="middle">按新索引头插回新链</text>
<path class="edge" d="M227.2 135.0 C553.5 135.0 553.5 135.0 879.8 135.0" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect class="edge-label-bg" x="459.2" y="126.0" width="147.7" height="15" rx="3"/><text class="t-label" x="533.1" y="137.0" text-anchor="middle">逐个 key 重算哈希求新索引</text>
<rect x="473.5" y="155.0" width="152.9" height="62.0" rx="8.0" fill="#e4ecfb" stroke="#3b6fd4" stroke-width="1.3"/>
<text class="t-node" x="550.0" y="182.7" text-anchor="middle" fill="#1f2328">负载因子超过 0.75</text>
<text class="t-node-sub" x="550.0" y="199.7" text-anchor="middle">Set 先插入，再判断</text>
<rect x="56.8" y="104.0" width="170.4" height="62.0" rx="8.0" fill="#eef0f3" stroke="#b9c0c9" stroke-width="1.3"/>
<text class="t-node" x="142.0" y="131.7" text-anchor="middle" fill="#1f2328">旧桶数组 m = 8</text>
<text class="t-node-sub" x="142.0" y="148.7" text-anchor="middle">迁移前先存 next 再改指针</text>
<rect x="879.8" y="104.0" width="156.4" height="62.0" rx="8.0" fill="#eef0f3" stroke="#b9c0c9" stroke-width="1.3"/>
<text class="t-node" x="958.0" y="131.7" text-anchor="middle" fill="#1f2328">新桶数组 2m = 16</text>
<text class="t-node-sub" x="958.0" y="148.7" text-anchor="middle">新索引只会是 i 或 i + m</text>
<rect x="32.0" y="247.0" width="1036.0" height="34" rx="7" fill="#e4ecfb" stroke="#3b6fd4" stroke-width="1.2"/>
<text class="t-conclusion" x="46.0" y="269.0">翻倍扩容把一次 O(m+n) 的停顿摊还到多次插入； 「只会去两个桶」这条性质本可用来优化迁移，但本文刻意保留了重算哈希的朴素写法。
</text>
<text class="t-label" x="32.0" y="301.0">图中桶数、负载因子均为本文实现的选择，阈值 0.75 是教学经验值而非理论常数；本图不描述 Go 原生 map 的扩容方式。</text>
</svg>
