<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="一个 key 落到桶里的两步：先哈希，再取低位">
<defs>
  <marker id="arrow" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="8" markerHeight="7"
          orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0 0.6 L9.5 4 L0 7.4 Z" fill="context-stroke"/>
  </marker>
  <marker id="arrow-muted" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="8" markerHeight="7"
          orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M0 0.6 L9.5 4 L0 7.4 Z" fill="#6b7280"/>
  </marker>
<style>
/* 变量声明在 svg 根元素上，不是 :root —— 独立 SVG 文档里 :root 不生效，
   变量会解析失败并回退成黑色填充（曾导致整张图变成黑底）。 */
svg {
  --bg: #ffffff; --bg-soft: #f6f7f9;
  --ink: #1f2328; --ink-muted: #6b7280;
  --line: #c9ced6; --neutral: #eef0f3;
  --primary: #3b6fd4; --primary-soft: #e4ecfb;
  --accent: #2f9e8f; --accent-soft: #dff2ef;
  --warn: #d98324; --warn-soft: #fbeedd;
  --danger: #c8483c; --danger-soft: #fae5e2;
  --violet: #7c5cbf; --violet-soft: #eee8f8;
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',sans-serif;
}
text { fill: var(--ink); }
.t-title { font-size: 26px; font-weight: 650; }
.t-sub { font-size: 14px; fill: var(--ink-muted); }
.t-region { font-size: 15px; font-weight: 600; }
.t-node { font-size: 14px; }
.t-node-sub { font-size: 11.5px; fill: var(--ink-muted); }
.t-label { font-size: 11.5px; fill: var(--ink-muted); }
.t-conclusion { font-size: 13px; font-weight: 550; }
.t-legend { font-size: 11.5px; fill: var(--ink-muted); }
.t-mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 11.5px; }
.edge { fill: none; }
.edge-label-bg { fill: var(--bg); }
</style>
</defs>
<rect width="1100" height="300" fill="#ffffff"/>
<text class="t-title" x="32" y="54">一个 key 落到桶里的两步：先哈希，再取低位</text>
<text class="t-sub" x="32" y="74">教学实现 · FNV-1a 32 位 · 桶数为 2 的幂</text>
<path class="edge" d="M138.2 135.0 C172.2 135.0 172.2 135.0 206.2 135.0" stroke="var(--primary)" stroke-width="2.0" marker-end="url(#arrow)"/>
<path class="edge" d="M389.8 135.0 C423.9 135.0 423.9 135.0 457.9 135.0" stroke="var(--primary)" stroke-width="2.0" marker-end="url(#arrow)"/>
<path class="edge" d="M583.0 135.0 C617.0 135.0 617.0 135.0 651.0 135.0" stroke="var(--primary)" stroke-width="2.0" marker-end="url(#arrow)"/>
<path class="edge" d="M885.4 135.0 C919.4 135.0 919.4 135.0 953.4 135.0" stroke="var(--primary)" stroke-width="2.0" marker-end="url(#arrow)"/>
<path class="edge" d="M583.0 135.0 C768.2 135.0 768.2 135.0 953.4 135.0" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect class="edge-label-bg" x="659.9" y="126.0" width="193.4" height="15" rx="3"/><text class="t-label" x="756.6" y="137.0" text-anchor="middle">扩容后 n 变，索引可能变，哈希不变</text>
<rect x="32.0" y="104.0" width="106.2" height="62.0" rx="8.0" fill="#eef0f3" stroke="#b9c0c9" stroke-width="1.3"/>
<text class="t-node" x="85.1" y="131.7" text-anchor="middle" fill="#1f2328">字符串 key</text>
<text class="t-node-sub" x="85.1" y="148.7" text-anchor="middle">例如 &quot;name&quot;</text>
<rect x="206.2" y="104.0" width="183.6" height="62.0" rx="8.0" fill="#e4ecfb" stroke="#3b6fd4" stroke-width="1.3"/>
<text class="t-node" x="298.0" y="131.7" text-anchor="middle" fill="#1f2328">hashString(key)</text>
<text class="t-node-sub" x="298.0" y="148.7" text-anchor="middle">FNV-1a 逐字节异或再乘素数</text>
<rect x="457.9" y="104.0" width="125.1" height="62.0" rx="8.0" fill="#e4ecfb" stroke="#3b6fd4" stroke-width="1.3"/>
<text class="t-node" x="520.4" y="131.7" text-anchor="middle" fill="#1f2328">32 位哈希值 h</text>
<text class="t-node-sub" x="520.4" y="148.7" text-anchor="middle">固定宽度数值</text>
<rect x="651.0" y="104.0" width="234.3" height="62.0" rx="8.0" fill="#e4ecfb" stroke="#3b6fd4" stroke-width="1.3"/>
<text class="t-node" x="768.2" y="131.7" text-anchor="middle" fill="#1f2328">h &amp; (n - 1)</text>
<text class="t-node-sub" x="768.2" y="148.7" text-anchor="middle">n 为当前桶数，等价于 h 对 2 的幂取模</text>
<rect x="953.4" y="104.0" width="114.6" height="62.0" rx="8.0" fill="#dff2ef" stroke="#2f9e8f" stroke-width="1.3"/>
<text class="t-node" x="1010.7" y="131.7" text-anchor="middle" fill="#1f2328">buckets[idx]</text>
<text class="t-node-sub" x="1010.7" y="148.7" text-anchor="middle">idx 落在 [0, n)</text>
<rect x="32.0" y="196.0" width="1036.0" height="34" rx="7" fill="#e4ecfb" stroke="#3b6fd4" stroke-width="1.2"/>
<text class="t-conclusion" x="46.0" y="218.0">「2 的幂」这个选择不在哈希函数上，而在索引计算上： 它换来一次位运算，同时把分布质量的赌注压在哈希值的低位上。
</text>
<text class="t-label" x="32.0" y="250.0">图中为 32 位 FNV-1a 的示意；生产系统应评估碰撞攻击风险，优先使用运行时或经充分评估的哈希实现。</text>
</svg>
